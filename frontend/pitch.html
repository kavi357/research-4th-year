<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pitch Analysis - Music Similarity</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        * {
            font-family: 'Inter', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            background-attachment: fixed;
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        }
        
        .gradient-text {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .nav-link {
            transition: all 0.3s ease;
            border-bottom: 3px solid transparent;
        }

        .nav-link.active {
            background: linear-gradient(135deg, #8e44ad 0%, #c471ed 100%);
            border-bottom-color: #a855f7;
        }

        .nav-link:hover:not(.active) {
            background: rgba(255, 255, 255, 0.1);
        }
        
        .track-card {
            transition: all 0.3s ease;
        }
        
        .track-card:hover {
            transform: translateX(5px);
            background: rgba(255, 255, 255, 0.08);
        }
        
        .progress-bar {
            transition: width 0.8s ease-in-out;
        }
        
        .result-box {
            max-height: 600px;
            overflow-y: auto;
        }
        
        .result-box::-webkit-scrollbar {
            width: 8px;
        }
        
        .result-box::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }
        
        .result-box::-webkit-scrollbar-thumb {
            background: rgba(142, 68, 173, 0.5);
            border-radius: 10px;
        }

        .match-badge {
            background: linear-gradient(135deg, #8e44ad 0%, #c471ed 100%);
            animation: pulse 2s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }

        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<body class="min-h-screen p-6">

<div class="max-w-6xl mx-auto">
    
    <!-- Header with Navigation -->
    <div class="glass-card rounded-2xl p-6 mb-6 fade-in">
        <div class="flex items-center justify-between mb-4">
            <div class="flex items-center">
                <div class="text-4xl mr-3">🎼</div>
                <h1 class="text-3xl font-bold gradient-text">Pitch Similarity Analysis</h1>
            </div>
            <button onclick="window.location.href='index.html'" class="bg-red-500 hover:bg-red-600 px-4 py-2 rounded-lg text-white font-semibold transition">
                ← Back to Upload
            </button>
        </div>

        <!-- Navigation -->
        <div class="flex gap-2">
            <button onclick="window.location.href='tempo.html'" class="nav-link flex-1 py-3 px-4 rounded-lg font-semibold text-white">
                🥁 Tempo Similarity
            </button>
            <button onclick="window.location.href='pitch.html'" class="nav-link active flex-1 py-3 px-4 rounded-lg font-semibold text-white">
                🎼 Pitch Similarity
            </button>
        </div>
    </div>

    <!-- Results -->
    <div class="glass-card rounded-2xl p-8 fade-in">
        <h3 class="text-2xl font-bold mb-6 flex items-center">
            <span class="text-3xl mr-3">🎼</span>
            <span>Top 5 - Pitch Similarity</span>
        </h3>

        <div id="resultBox" class="result-box space-y-4"></div>
    </div>

</div>

<script>
// Load data from localStorage
const data = JSON.parse(localStorage.getItem('analysisData'));

if (!data) {
    document.getElementById('resultBox').innerHTML = `
        <div class="bg-red-500/20 border border-red-500 rounded-xl p-6 text-center">
            <p class="text-red-300 text-lg mb-4">⚠️ No analysis data found!</p>
            <button onclick="window.location.href='index.html'" class="bg-red-500 hover:bg-red-600 px-6 py-3 rounded-lg text-white font-semibold">
                Go to Upload Page
            </button>
        </div>
    `;
} else {
    displayResults(data.top_5_pitch);
}

function displayResults(tracks) {
    const resultBox = document.getElementById('resultBox');
    resultBox.innerHTML = '';
    
    tracks.forEach((track, index) => {
        const card = document.createElement('div');
        card.className = 'track-card glass-card rounded-xl p-5';
        
        const similarityPercent = (track.similarity * 100).toFixed(1);
        
        card.innerHTML = `
            <div class="flex justify-between items-start mb-4">
                <div class="flex-1">
                    <div class="flex items-center gap-3 mb-2">
                        <span class="text-3xl font-bold text-gray-500">#${index + 1}</span>
                        <div>
                            <p class="font-bold text-xl text-white">${track.title}</p>
                            <p class="text-xs text-gray-500 uppercase tracking-wider">Track ID: ${track.track_id}</p>
                        </div>
                    </div>
                </div>
                <div class="text-right ml-4">
                    <div class="match-badge rounded-xl px-4 py-2">
                        <p class="text-3xl font-bold text-white">${similarityPercent}%</p>
                        <p class="text-xs text-white/80 uppercase tracking-wide">Pitch Match</p>
                    </div>
                </div>
            </div>
            
            <div class="bg-black/30 rounded-xl p-5">
                <div class="flex justify-between items-center mb-3">
                    <p class="text-sm text-gray-400 uppercase tracking-wider font-semibold">🎼 Pitch Comparison</p>
                    <p class="text-lg font-bold text-purple-400">${similarityPercent}% Match</p>
                </div>
                <div class="bg-gray-700/50 rounded-full h-4 mb-4 overflow-hidden">
                    <div class="progress-bar bg-gradient-to-r from-purple-500 to-purple-300 h-4 rounded-full" style="width: ${similarityPercent}%"></div>
                </div>
                <div class="grid grid-cols-2 gap-4 text-center">
                    <div class="bg-purple-500/20 rounded-lg p-3">
                        <p class="text-xs text-gray-400 mb-1">Your Song</p>
                        <p class="text-2xl font-bold text-purple-300">${track.query_pitch.toFixed(1)} <span class="text-sm">Hz</span></p>
                    </div>
                    <div class="bg-purple-500/20 rounded-lg p-3">
                        <p class="text-xs text-gray-400 mb-1">Database Track</p>
                        <p class="text-2xl font-bold text-purple-300">${track.db_pitch.toFixed(1)} <span class="text-sm">Hz</span></p>
                    </div>
                </div>
                <p class="text-xs text-gray-400 text-center mt-3">
                    Difference: <span class="text-white font-semibold">${track.pitch_diff.toFixed(1)} Hz</span>
                </p>
            </div>
        `;
        
        resultBox.appendChild(card);
    });
}
</script>

</body>
</html>
