<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tempo Analysis - Music Similarity</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        * {
            font-family: 'Inter', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            background-attachment: fixed;
            min-height: 100vh;
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        }
        
        .gradient-text {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .nav-link {
            transition: all 0.3s ease;
            border-bottom: 3px solid transparent;
            position: relative;
            overflow: hidden;
        }

        .nav-link::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: left 0.5s;
        }

        .nav-link:hover::before {
            left: 100%;
        }

        .nav-link.active {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            border-bottom-color: #60a5fa;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
        }

        .nav-link:hover:not(.active) {
            background: rgba(59, 130, 246, 0.2);
        }
        
        .track-card {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }
        
        .track-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(59, 130, 246, 0.1), transparent);
            transition: left 0.6s;
        }
        
        .track-card:hover::before {
            left: 100%;
        }
        
        .track-card:hover {
            transform: translateX(8px) scale(1.02);
            background: rgba(59, 130, 246, 0.1);
            border-color: rgba(59, 130, 246, 0.3);
            box-shadow: 0 8px 30px rgba(59, 130, 246, 0.3);
        }
        
        .progress-bar {
            transition: width 1.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .result-box {
            max-height: 700px;
            overflow-y: auto;
        }
        
        .result-box::-webkit-scrollbar {
            width: 10px;
        }
        
        .result-box::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }
        
        .result-box::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            border-radius: 10px;
        }

        .result-box::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
        }

        .match-badge {
            background: linear-gradient(135deg, #3b82f6 0%, #60a5fa 100%);
            animation: pulse 2s ease-in-out infinite;
            box-shadow: 0 4px 20px rgba(59, 130, 246, 0.5);
        }
        
        @keyframes pulse {
            0%, 100% { 
                opacity: 1;
                box-shadow: 0 4px 20px rgba(59, 130, 246, 0.5);
            }
            50% { 
                opacity: 0.85;
                box-shadow: 0 4px 30px rgba(59, 130, 246, 0.7);
            }
        }

        .fade-in {
            animation: fadeIn 0.6s ease-in;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .stagger-1 { animation-delay: 0.1s; }
        .stagger-2 { animation-delay: 0.2s; }
        .stagger-3 { animation-delay: 0.3s; }
        .stagger-4 { animation-delay: 0.4s; }
        .stagger-5 { animation-delay: 0.5s; }

        .rank-badge {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-weight: 800;
            font-size: 1.5rem;
            box-shadow: 0 4px 15px rgba(251, 191, 36, 0.4);
        }

        .rank-badge.gold {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
        }

        .rank-badge.silver {
            background: linear-gradient(135deg, #e5e7eb, #9ca3af);
        }

        .rank-badge.bronze {
            background: linear-gradient(135deg, #d97706, #b45309);
        }

        .rank-badge.other {
            background: linear-gradient(135deg, #6b7280, #4b5563);
        }
    </style>
</head>

<body class="min-h-screen p-6">

<div class="max-w-7xl mx-auto">
    
    <!-- Header with Navigation -->
    <div class="glass-card rounded-3xl p-8 mb-8 fade-in">
        <div class="flex items-center justify-between mb-6">
            <div class="flex items-center">
                <div class="text-5xl mr-4">🥁</div>
                <div>
                    <h1 class="text-4xl font-bold gradient-text">Tempo Similarity Analysis</h1>
                    <p class="text-gray-400 text-sm mt-1">Detailed comparison with database tracks</p>
                </div>
            </div>
            <button onclick="window.location.href='index.html'" class="bg-gradient-to-r from-red-500 to-red-600 hover:from-red-600 hover:to-red-700 px-6 py-3 rounded-xl text-white font-bold transition shadow-lg hover:shadow-xl transform hover:-translate-y-1">
                ← Back to Upload
            </button>
        </div>

        <!-- Navigation -->
        <div class="flex gap-3">
            <button onclick="window.location.href='tempo.html'" class="nav-link active flex-1 py-4 px-6 rounded-xl font-bold text-white text-lg">
                🥁 Tempo Similarity
            </button>
            <button onclick="window.location.href='pitch.html'" class="nav-link flex-1 py-4 px-6 rounded-xl font-bold text-white text-lg">
                🎼 Pitch Similarity
            </button>
        </div>
    </div>

    <!-- Results -->
    <div class="glass-card rounded-3xl p-10 fade-in">
        <div class="flex items-center justify-between mb-8">
            <h3 class="text-3xl font-bold flex items-center">
                <span class="text-4xl mr-4">🥁</span>
                <span class="gradient-text">Top 5 Tempo Matches</span>
            </h3>
            <div class="text-right">
                <p class="text-gray-400 text-sm">Sorted by tempo similarity</p>
                <p class="text-blue-400 font-semibold text-lg">Most similar first</p>
            </div>
        </div>

        <div id="resultBox" class="result-box space-y-6"></div>
    </div>

</div>

<script>
// Load data from localStorage
const data = JSON.parse(localStorage.getItem('analysisData'));

if (!data) {
    document.getElementById('resultBox').innerHTML = `
        <div class="bg-red-500/20 border-2 border-red-500 rounded-2xl p-8 text-center">
            <div class="text-6xl mb-4">⚠️</div>
            <p class="text-red-300 text-xl font-bold mb-6">No analysis data found!</p>
            <p class="text-gray-300 mb-6">Please upload and analyze a song first.</p>
            <button onclick="window.location.href='index.html'" class="bg-gradient-to-r from-red-500 to-red-600 hover:from-red-600 hover:to-red-700 px-8 py-4 rounded-xl text-white font-bold shadow-lg transition transform hover:scale-105">
                Go to Upload Page
            </button>
        </div>
    `;
} else {
    displayResults(data.top_5_tempo);
}

function getRankBadgeClass(index) {
    if (index === 0) return 'gold';
    if (index === 1) return 'silver';
    if (index === 2) return 'bronze';
    return 'other';
}

function displayResults(tracks) {
    const resultBox = document.getElementById('resultBox');
    resultBox.innerHTML = '';
    
    tracks.forEach((track, index) => {
        const card = document.createElement('div');
        card.className = `track-card glass-card rounded-2xl p-6 fade-in stagger-${index + 1} border border-white/10`;
        
        const similarityPercent = (track.similarity * 100).toFixed(1);
        
        card.innerHTML = `
            <div class="flex justify-between items-start mb-6">
                <div class="flex items-center gap-5 flex-1">
                    <div class="rank-badge ${getRankBadgeClass(index)}">
                        #${index + 1}
                    </div>
                    <div class="flex-1">
                        <p class="font-bold text-2xl text-white mb-1">${track.title}</p>
                        <p class="text-xs text-gray-500 uppercase tracking-wider">Track ID: ${track.track_id}</p>
                    </div>
                </div>
                <div class="text-right ml-6">
                    <div class="match-badge rounded-2xl px-6 py-3">
                        <p class="text-4xl font-bold text-white mb-1">${similarityPercent}%</p>
                        <p class="text-xs text-white/90 uppercase tracking-wide font-semibold">Tempo Match</p>
                    </div>
                </div>
            </div>
            
            <div class="bg-gradient-to-br from-blue-500/10 to-blue-700/10 rounded-2xl p-6 border border-blue-400/20">
                <div class="flex justify-between items-center mb-4">
                    <p class="text-sm text-gray-300 uppercase tracking-wider font-bold flex items-center">
                        <span class="text-2xl mr-2">🥁</span>
                        Tempo Comparison
                    </p>
                    <p class="text-xl font-bold text-blue-300">${similarityPercent}% Match</p>
                </div>
                <div class="bg-gray-700/50 rounded-full h-5 mb-5 overflow-hidden border border-gray-600/50">
                    <div class="progress-bar bg-gradient-to-r from-blue-500 via-blue-400 to-blue-300 h-5 rounded-full shadow-lg" style="width: 0%; --final-width: ${similarityPercent}%"></div>
                </div>
                <div class="grid grid-cols-2 gap-5 text-center mb-4">
                    <div class="bg-gradient-to-br from-blue-500/20 to-blue-600/20 rounded-xl p-5 border border-blue-400/30">
                        <p class="text-xs text-blue-200 mb-2 uppercase tracking-wide font-semibold">Your Song</p>
                        <p class="text-3xl font-bold text-blue-300">${track.query_tempo.toFixed(1)} <span class="text-base text-gray-400">BPM</span></p>
                    </div>
                    <div class="bg-gradient-to-br from-blue-500/20 to-blue-600/20 rounded-xl p-5 border border-blue-400/30">
                        <p class="text-xs text-blue-200 mb-2 uppercase tracking-wide font-semibold">Database Track</p>
                        <p class="text-3xl font-bold text-blue-300">${track.db_tempo.toFixed(1)} <span class="text-base text-gray-400">BPM</span></p>
                    </div>
                </div>
                <div class="flex items-center justify-center gap-3 bg-black/30 rounded-lg py-3 px-4">
                    <svg class="w-5 h-5 text-yellow-400" fill="currentColor" viewBox="0 0 20 20">
                        <path d="M9 2a1 1 0 000 2h2a1 1 0 100-2H9z"></path>
                        <path fill-rule="evenodd" d="M4 5a2 2 0 012-2 3 3 0 003 3h2a3 3 0 003-3 2 2 0 012 2v11a2 2 0 01-2 2H6a2 2 0 01-2-2V5zm3 4a1 1 0 000 2h.01a1 1 0 100-2H7zm3 0a1 1 0 000 2h3a1 1 0 100-2h-3zm-3 4a1 1 0 100 2h.01a1 1 0 100-2H7zm3 0a1 1 0 100 2h3a1 1 0 100-2h-3z" clip-rule="evenodd"></path>
                    </svg>
                    <p class="text-sm text-gray-300">
                        Tempo Difference: <span class="text-white font-bold text-lg">${track.tempo_diff.toFixed(1)} BPM</span>
                    </p>
                </div>
            </div>
        `;
        
        resultBox.appendChild(card);
        
        // Animate progress bar after element is added
        setTimeout(() => {
            const progressBar = card.querySelector('.progress-bar');
            const finalWidth = progressBar.style.getPropertyValue('--final-width');
            progressBar.style.width = finalWidth;
        }, 100 * (index + 1));
    });
}
</script>

</body>
</html>
